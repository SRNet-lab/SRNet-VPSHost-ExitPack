[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "srnet-exits"
version = "0.4.0"
description = "SRNet Exits: buy exit time with a direct USDC payment to the seller, and connect through the exit"
readme = "client/README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# No "srnet-client" here: that name isn't on PyPI, so pip could pull someone else's package.
# srnet-exits runs on its own (client/install.sh), or as an add-on inside the SRNet client's own
# environment (SRNet-Desktop install.sh --with-exits).
dependencies = [
    "cryptography>=41",
    "pyzmq>=25",
    "qrcode>=7",
]

[project.scripts]
srnet-exits = "srnet_exits.standalone:entry"

[project.entry-points."srnet.addons"]
exits = "srnet_exits.addon:ADDON"

[tool.setuptools]
packages = ["srnet_exits", "srnet_exits._seller", "srnet_exits._board", "srnet_exits._lease"]

[tool.setuptools.package-dir]
"srnet_exits" = "client/srnet_exits"
"srnet_exits._seller" = "seller"
"srnet_exits._board" = "board"
"srnet_exits._lease" = "contrib/exit-lease"

[tool.setuptools.package-data]
"srnet_exits" = ["web/*"]
"srnet_exits._seller" = ["VERSION"]
